<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:         #0d1117;
      --card:       #161c24;
      --border:     #212830;
      --green:      #2cc76e;
      --green-dark: #25b060;
      --text:       #e8edf3;
      --muted:      #7a8896;
      --yellow:     #f5a623;
      --font:       -apple-system, "Segoe UI", system-ui, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      width: 100%;
      max-width: 500px;
      padding: 32px 22px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logos {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo-box {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1b2230;
    }
    .logo-freecash img { width: 54px; height: 54px; object-fit: cover; }
    .logo-tiktok { background: #010101; }
    .logo-tiktok img { width: 36px; height: 36px; object-fit: contain; }
    .logo-sep { color: var(--muted); font-size: 20px; font-weight: 400; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1.5px solid var(--green);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .badge svg { width: 13px; height: 13px; flex-shrink: 0; }
    h1.headline {
      font-size: clamp(24px, 6vw, 36px);
      font-weight: 800;
      text-align: center;
      line-height: 1.18;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    h1.headline .accent { color: var(--green); }
    .subtext {
      font-size: 14px;
      font-weight: 400;
      color: var(--muted);
      text-align: center;
      line-height: 1.65;
      margin-bottom: 22px;
    }
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--green);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 17px 38px;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 16px;
      transition: background 0.15s, transform 0.1s;
    }
    .cta-btn:hover  { background: var(--green-dark); transform: translateY(-1px); }
    .cta-btn:active { transform: translateY(0); }
    .cta-apple { width: 26px; height: 26px; flex-shrink: 0; fill: #ffffff; }
    .cta-text { display: flex; flex-direction: column; align-items: flex-start; }
    .cta-text strong { font-size: 16px; font-weight: 700; color: #ffffff; line-height: 1.25; white-space: nowrap; }
    .cta-text span { font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.72); white-space: nowrap; }

    /* ── ACTIVATION BOX ── */
    .activation-box {
      width: 100%;
      background: #1a1208;
      border: 1.5px solid #3d2e0e;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
    }
    .activation-badge {
      position: absolute;
      top: 0;
      right: 0;
      background: #f5a623;
      color: #000;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-bottom-left-radius: 10px;
    }
    .activation-body {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px 16px 16px 16px;
    }
    .activation-lock {
      font-size: 22px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .activation-title {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      padding-right: 70px;
    }
    .activation-text {
      font-size: 13px;
      color: #a09070;
      line-height: 1.6;
    }
    .activation-highlight {
      color: var(--yellow);
      font-weight: 700;
    }

    .section-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
      align-self: center;
    }
    .offer-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      margin-bottom: 20px;
      position: relative;
    }
    .offer-play-circle { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .offer-play-circle img { width: 46px; height: 46px; object-fit: contain; }
    .play-fallback { display: none; fill: #ffffff; width: 15px; height: 15px; margin-left: 3px; }
    .offer-info { flex: 1; min-width: 0; }
    .offer-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .offer-title { font-weight: 700; font-size: 14px; color: #fff; }
    .offer-rate { background: var(--yellow); color: #000; font-size: 10px; font-weight: 700; padding: 2px 9px; border-radius: 999px; letter-spacing: 0.02em; }
    .offer-sub { font-size: 12px; font-weight: 400; color: var(--muted); }
    .offer-price { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; margin-right: 16px; }
    .offer-price-val { font-size: 24px; font-weight: 700; color: var(--green); line-height: 1; }
    .offer-stars { display: flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--yellow); }
    .offer-stars svg { width: 11px; height: 11px; fill: var(--yellow); flex-shrink: 0; }
    .offer-arrow { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 17px; }
